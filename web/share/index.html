<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share — The Center Is a Lie</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --paper: #fbfbf8; --ink: #1b1b1d; --soft: #3a3a3d; --faint: #6b6b70;
      --accent: #b8240f; --line: #e2e2dc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .sharepage { max-width: 980px; margin: 0 auto; padding: 48px 24px 96px; }
    .eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
    h1 { font-family: Georgia, serif; font-size: 2.4rem; margin: 0 0 12px; }
    .lede { color: var(--soft); max-width: 60ch; margin: 0; line-height: 1.5; }
    .backlink { display: inline-block; margin-top: 16px; color: var(--accent); text-decoration: none; font-size: .95rem; }
    .backlink:hover { text-decoration: underline; }

    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; margin-top: 44px; }
    .gcard img { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin-bottom: 12px; }

    .dest-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .dest { font: inherit; font-size: .88rem; padding: .46em .9em; border: 1px solid #d4d4cd;
      border-radius: 5px; background: #fff; color: var(--ink); text-decoration: none; cursor: pointer; }
    .dest:hover { border-color: var(--accent); color: var(--accent); }
    .note { color: #2e7d32; font-size: .82rem; margin: .6rem 0 0; min-height: 1em; }

    @media (max-width: 640px) {
      h1 { font-size: 2rem; }
      .gallery { grid-template-columns: 1fr; gap: 30px; }
    }
  </style>
</head>
<body>
  <main class="sharepage">
    <header>
      <p class="eyebrow">Share</p>
      <h1>The Center Is a Lie</h1>
      <p class="lede">Pick any card and post it. X, Bluesky, and LinkedIn open prefilled with a link that unfurls to that card. Instagram downloads the image and copies a caption to paste.</p>
      <a class="backlink" href="/">&larr; Back to the essay</a>
    </header>

    <section class="gallery" id="gallery" aria-label="Shareable cards"></section>
  </main>
  <script type="module" src="../js-v2/share-page.js"></script>
</body>
</html>
