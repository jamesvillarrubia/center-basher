<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="./chart-card.css"></head>
<body>
  <div class="chartcard">
    <div class="cc-claim"><span class="tag">The claim</span> &ldquo;The primary is a fair, open contest.&rdquo;</div>
    <div class="cc-title">Before a single vote was cast, party insiders had picked <span class="hl">45 to 1</span>.</div>
    <div class="cc-sub">Superdelegate endorsements in November 2015 &mdash; three months before Iowa.</div>

    <div class="cc-chart"><svg id="sd" viewBox="0 0 1240 449" role="img"
      aria-label="Superdelegate endorsements as of November 2015: 45 for Clinton, 1 for Sanders"></svg></div>

    <div class="cc-foot">
      <div class="cc-source">Source: NPR, &ldquo;Clinton Has 45-To-1 &lsquo;Superdelegate&rsquo; Advantage Over Sanders&rdquo; (Nov 13, 2015).</div>
      <div class="cc-btn">thecenterisalie.org</div>
    </div>
  </div>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('sd');
    const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
    const txt = (a, s) => { const t = el('text', a); t.textContent = s; svg.appendChild(t); return t; };

    const COLS = 23, r = 27, sx = 52, sy = 114;
    const x0 = (1240 - (COLS - 1) * sx) / 2, y0 = 152;

    txt({ x: x0 - 27, y: y0 - 62, 'text-anchor': 'start', fill: '#2c5b9c', 'font-size': 36, 'font-weight': 800 }, 'Endorsed Clinton: 45');

    for (let i = 0; i < 46; i++) {
      const cx = x0 + (i % COLS) * sx, cy = y0 + ((i / COLS) | 0) * sy;
      const sanders = i === 45;
      svg.appendChild(el('circle', { cx, cy, r, fill: sanders ? '#b8240f' : '#2c5b9c' }));
      if (sanders) {
        svg.appendChild(el('circle', { cx, cy, r: r + 11, fill: 'none', stroke: '#b8240f', 'stroke-width': 4 }));
        // callout down to the label
        svg.appendChild(el('line', { x1: cx, y1: cy + r + 20, x2: cx, y2: cy + r + 58, stroke: '#b8240f', 'stroke-width': 3 }));
        txt({ x: cx, y: cy + r + 96, 'text-anchor': 'end', fill: '#b8240f', 'font-size': 34, 'font-weight': 800 }, 'Endorsed Sanders: 1');
      }
    }
  </script>
</body></html>
