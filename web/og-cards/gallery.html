<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chart cards — contact sheet</title>
<style>
  body { margin:0; padding:36px 40px 80px; background:#e9e9e4; color:#1b1b1d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:#6b6b70; font-size:14px; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(620px,1fr)); gap:32px; }
  figure { margin:0; background:#fff; border:1px solid #cfcdc7; border-radius:10px; padding:12px; }
  figure img { width:100%; height:auto; display:block; border:1px solid #eee; border-radius:4px; }
  figcaption { font-size:13px; color:#6b6b70; margin-top:9px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.02em; }
  .new { border-color:#b8240f; box-shadow:0 0 0 2px #b8240f22; }
  .new figcaption::after { content:" · NEW"; color:#b8240f; font-weight:700; }
</style></head>
<body>
  <h1>Chart rebuttal cards</h1>
  <p class="sub">All 27 cards at 1600×900. Source: <code>web/og-cards/chart-&lt;slug&gt;.html</code> · rebuild with <code>pnpm render:charts</code></p>
  <div class="grid" id="g"></div>
<script>
  const slugs = ['pools','bothends','insideoutside','1in100','mirage','illusion','alienated','authenticity','badtrade','care','changelane','consistency','deficit','fundamentals','gotv','m4a','margins','noconstituency','persuasion','popular','rr','sc','superdelegates','trust','turnout','warmth','withintent'];
  const isNew = new Set(['pools','bothends','insideoutside']);
  const g = document.getElementById('g');
  for (const s of slugs) {
    const f = document.createElement('figure');
    if (isNew.has(s)) f.className = 'new';
    f.innerHTML = '<img src="../public/og/charts/' + s + '.png" alt="' + s + '"><figcaption>' + s + '</figcaption>';
    g.appendChild(f);
  }
</script>
</body></html>
