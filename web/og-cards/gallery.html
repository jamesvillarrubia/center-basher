<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart cards — contact sheet</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 80px; background:#e9e9e4; color:#1b1b1d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#6b6b70; font-size:13px; margin:0 0 22px; }
  /* min(100%, 620px) so on a phone each column is the full screen width and the
     card scales to fit, instead of forcing a 620px column that zooms out. */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,620px),1fr)); gap:20px; }
  figure { margin:0; background:#fff; border:1px solid #cfcdc7; border-radius:10px; padding:8px; }
  figure a { display:block; }
  figure img { width:100%; height:auto; display:block; border:1px solid #eee; border-radius:4px; }
  figcaption { font-size:13px; color:#6b6b70; margin-top:7px; word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.02em; }
</style></head>
