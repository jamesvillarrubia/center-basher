config:
  # Cloudflare Account ID + Zone ID come from the git-ignored infra/.env
  # (CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE_ID) — `set -a; source .env; set +a` before pulumi.
  # The API token is a secret:  pulumi config set --secret cloudflare:apiToken <TOKEN>
  # (or just put it in .env as CLOUDFLARE_API_TOKEN and source it).
  center-basher-infra:domain: thecenterisalie.org
  center-basher-infra:githubOwner: jamesvillarrubia
  center-basher-infra:githubRepo: center-basher
  center-basher-infra:productionBranch: claude/dazzling-maxwell-sSHUR
  center-basher-infra:projectName: thecenterisalie
